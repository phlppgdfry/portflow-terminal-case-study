name: Pages

# Publishes site/ as the case website. Links in site/index.html point at the
# repository files (../docs/…) so they work on GitHub; on Pages they are
# rewritten to the same files on github.com.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp -r site/. _site/
          sed -i -E 's#(href|src)="\.\./([^"]+)"#\1="https://github.com/${{ github.repository }}/blob/main/\2"#g' _site/*.html
          ! grep -nE '(href|src)="\.\./' _site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

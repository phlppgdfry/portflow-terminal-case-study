openapi: 3.0.3
info:
  title: PortFlow vehicle manifest API
  version: 1.3.0
  description: |
    Inbound vehicle manifests for the terminal (fictional case study).
    Partners call the REST endpoint through the API gateway, which authenticates them.
    EDI arrives through the integration layer, which posts the interchange unchanged.
    Rejection codes: integrations/error-scenarios.md.
servers:
  - url: http://127.0.0.1:8080
    description: Local demo (python -m portflow serve)
tags:
  - name: Manifests
  - name: Operations
  - name: Monitoring

paths:
  /api/v1/vehicle-manifests:
    post:
      tags: [Manifests]
      summary: Announce a shipment of vehicles (REST channel)
      operationId: submitManifest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Manifest' }
            example:
              partnerId: OSP
              messageRef: OSP-MSG-88412
              shipmentId: OSP-2026-03317
              expectedArrival: '2026-10-08T09:30:00+02:00'
              terminalCode: BEZEE
              vehicles:
                - { vin: YV1XZK9V1R2000731, make: Volvo, model: EX30 }
      responses:
        '201': { $ref: '#/components/responses/Accepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/SyntaxError' }
        '413': { description: Payload larger than 1 MB }
        '422': { $ref: '#/components/responses/Rejected' }

  /api/v1/edi-messages:
    post:
      tags: [Manifests]
      summary: Submit one VMANIF interchange (EDI channel, called by the integration layer)
      operationId: submitEdi
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
            example: "UNA:+.? 'UNB+UNOC:3+HRN:ZZZ+PORTFLOW:ZZZ+261007:0941+000125'UNH+1+VMANIF:1:0:PF'..."
      responses:
        '201': { $ref: '#/components/responses/Accepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '202': { $ref: '#/components/responses/Pending' }
        '400': { $ref: '#/components/responses/SyntaxError' }
        '422': { $ref: '#/components/responses/Rejected' }

  /api/v1/gate-events:
    post:
      tags: [Operations]
      summary: Register a vehicle arrival at the gate
      operationId: registerArrival
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vin]
              properties:
                vin: { type: string, example: KNAB2512AST123456 }
                eventType: { type: string, enum: [ARRIVED], default: ARRIVED }
                eventTime: { type: string, example: '2026-10-08T09:42:00', description: Local time; default now }
                source: { type: string, default: GATE }
      responses:
        '201':
          description: Arrival registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  vin: { type: string }
                  shipment: { type: string }
                  status: { type: string, enum: [ARRIVED] }
        '400': { description: Body is not valid JSON or has no vin }
        '404': { description: No vehicle with this VIN is expected }
        '422': { description: Event type not supported }

  /api/v1/messages:
    get:
      tags: [Operations]
      summary: List inbound messages, newest first
      operationId: listMessages
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACCEPTED, REJECTED] } }
        - { name: partner, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MessageSummary' }
        '503': { description: Database unavailable }

  /api/v1/messages/{messageId}:
    get:
      tags: [Operations]
      summary: One message with every rejection reason and the raw payload
      operationId: getMessage
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Message detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageDetail' }
        '404': { description: Not found }

  /api/v1/shipments:
    get:
      tags: [Operations]
      summary: Expected shipments with announced and arrived counts
      operationId: listShipments
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        '200':
          description: Shipments ordered by expected arrival
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    shipment_id: { type: integer }
                    partner_id: { type: string }
                    shipment_ref: { type: string }
                    expected_arrival: { type: string }
                    vehicles: { type: integer }
                    arrived: { type: integer }

  /api/v1/reports/kpis:
    get:
      tags: [Operations]
      summary: KPIs for the last 24 hours
      operationId: getKpis
      responses:
        '200': { description: KPI object (messagesLast24h, partners, topErrors, arrivals, avgProcessingSeconds, pendingBacklog) }

  /health:
    get:
      tags: [Monitoring]
      summary: Health for monitoring and first-line checks
      operationId: health
      responses:
        '200':
          description: UP or DEGRADED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: DOWN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  schemas:
    Manifest:
      type: object
      required: [partnerId, messageRef, shipmentId, expectedArrival, terminalCode, vehicles]
      properties:
        partnerId: { type: string, maxLength: 10, description: Partner code issued at onboarding }
        messageRef: { type: string, maxLength: 35, description: Unique per partner; resending the same value is safe }
        shipmentId: { type: string, maxLength: 35, description: Announced once per partner }
        expectedArrival: { type: string, description: 'ISO 8601 with time of day; an offset is converted to terminal local time' }
        terminalCode: { type: string, enum: [BEZEE] }
        vehicles:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [vin]
            properties:
              vin: { type: string, pattern: '^[A-HJ-NPR-Z0-9]{17}$' }
              make: { type: string, maxLength: 40 }
              model: { type: string, maxLength: 60 }
    Outcome:
      type: object
      properties:
        status: { type: string, enum: [ACCEPTED, REJECTED, DUPLICATE, PENDING] }
        messageId: { type: integer, nullable: true }
        errors:
          type: array
          items: { $ref: '#/components/schemas/Error' }
    Error:
      type: object
      properties:
        code: { type: string, example: V-VIN-FORMAT }
        field: { type: string, example: 'vehicles[0].vin' }
        message: { type: string }
    MessageSummary:
      type: object
      properties:
        message_id: { type: integer }
        partner_code: { type: string }
        message_ref: { type: string }
        channel: { type: string, enum: [REST, EDI] }
        status: { type: string, enum: [ACCEPTED, REJECTED] }
        shipment_ref: { type: string }
        vehicle_count: { type: integer }
        received_at: { type: string }
        processed_at: { type: string }
        error_codes: { type: string, nullable: true }
    MessageDetail:
      allOf:
        - $ref: '#/components/schemas/MessageSummary'
        - type: object
          properties:
            raw_payload: { type: string }
            errors:
              type: array
              items:
                type: object
                properties:
                  error_code: { type: string }
                  field_path: { type: string }
                  detail: { type: string }
    Health:
      type: object
      properties:
        status: { type: string, enum: [UP, DEGRADED, DOWN] }
        version: { type: string }
        database: { type: string, enum: [UP, NO_CONNECTION, DOWN] }
        pool:
          type: object
          properties:
            size: { type: integer }
            available: { type: integer }
        pendingBacklog: { type: integer }
  responses:
    Accepted:
      description: All rules passed; shipment and vehicles stored
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Outcome' }
          example: { status: ACCEPTED, messageId: 7, errors: [] }
    Duplicate:
      description: Same partner and message reference already received; nothing done
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Outcome' }
          example: { status: DUPLICATE, messageId: 7, errors: [] }
    Pending:
      description: Database unavailable; message kept and processed automatically. Do not resend under a new reference.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Outcome' }
          example: { status: PENDING, messageId: null, errors: [] }
    SyntaxError:
      description: Payload unreadable; stored as rejected with E-SYNTAX
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Outcome' }
    Rejected:
      description: One or more business rules failed; nothing created
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Outcome' }
          example:
            status: REJECTED
            messageId: 12
            errors:
              - { code: V-VIN-FORMAT, field: 'vehicles[0].vin', message: "'WVWZZZE1ZPP0123O5' is not a valid VIN" }
